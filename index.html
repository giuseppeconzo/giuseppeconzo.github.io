<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Publications - Research Portfolio</title>
  
  <!-- Libreria BibTeX Parser nativa per il browser -->
  <script src="https://cdn.jsdelivr.net/npm/bibtex-parse-js@0.0.24/bibtexParse.min.js"></script>
  
  <style>
    :root {
      --nasa-blue: #0b3d91;
      --nasa-red: #fc3d21;
      --dark-bg: #111418;
      --card-bg: #1a202c;
      --text-main: #e2e8f0;
      --text-muted: #a0aec0;
      --border-color: #2d3748;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--dark-bg);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 20px;
      margin-bottom: 30px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      color: #fff;
    }

    .counters {
      font-size: 14px;
      color: var(--text-muted);
    }

    .pub {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px 20px;
      margin-bottom: 15px;
      transition: border-color 0.2s;
    }

    .pub:hover {
      border-color: var(--nasa-blue);
    }

    .authors {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .title a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
    }

    .title a:hover {
      color: #63b3ed;
      text-decoration: underline;
    }

    .journal {
      font-style: italic;
      font-size: 13px;
      color: #cbd5e0;
      margin-top: 4px;
    }

    .doi {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .badge {
      display: inline-block;
      padding: 2px 6px;
      font-size: 11px;
      font-weight: bold;
      border-radius: 4px;
      color: #fff;
      margin-right: 6px;
    }

    .note {
      color: #ecc94b;
      font-size: 12px;
      font-weight: bold;
      margin-left: 5px;
    }

    .pub-actions {
      margin-top: 10px;
      display: flex;
      gap: 10px;
    }

    .copy-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      background: var(--border-color);
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Scientific Publications</h1>
      <div class="counters" id="counters">Loading statistics...</div>
    </header>

    <div id="publications-container">
      <p style="color: var(--text-muted);">Caricamento pubblicazioni in corso...</p>
    </div>
  </div>

  <script>
    let rawBibtexText = '';

    // Funzione di utilità per escaping HTML
    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Caricamento del file export-bibtex.bib tramite bibtex-parse-js
    async function loadBibtexFile() {
      try {
        const response = await fetch('export-bibtex.bib');
        if (!response.ok) throw new Error('File export-bibtex.bib non trovato');
        rawBibtexText = await response.text();
        
        // Parsing robusto con bibtex-parse-js
        const entries = bibtexParse.toJSON(rawBibtexText);
        
        renderPublications(entries);
      } catch (err) {
        console.error("Errore caricamento BibTeX:", err);
        document.getElementById('publications-container').innerHTML = `
          <div style="color: var(--nasa-red); font-size: 13px; padding: 15px; border: 1px solid var(--nasa-red); border-radius: 6px;">
            <strong>Impossibile caricare il file 'export-bibtex.bib'.</strong><br>
            Assicurati che il file si trovi nella stessa cartella e che il sito sia eseguito tramite un server locale (es. VS Code Live Server / Python http.server).
          </div>`;
      }
    }

    function renderPublications(entries) {
      const container = document.getElementById('publications-container');
      container.innerHTML = '';

      // Ordina per anno decrescente
      entries.sort((a, b) => {
        const yearA = parseInt(a.entryTags.year) || 0;
        const yearB = parseInt(b.entryTags.year) || 0;
        return yearB - yearA;
      });

      let totalCount = entries.length;
      let firstCount = 0;

      entries.forEach(entry => {
        const f = entry.entryTags || {};
        const year = f.year || '2026';
        const authors = f.author || '';
        const title = f.title || '';
        const journal = f.journal || f.booktitle || '';
        const doi = f.doi ? `DOI: ${f.doi}` : '';
        const adsurl = f.adsurl || '';
        const eprint = f.eprint ? `arXiv:${f.eprint}` : '';

        // Rileva se sei primo autore
        const isFirstAuthor = authors.toLowerCase().startsWith('conzo');
        if (isFirstAuthor) firstCount++;

        const isDiscovery = title.toLowerCase().includes('detection') || title.toLowerCase().includes('candidate') || title.toLowerCase().includes('nuovo') || title.toLowerCase().includes('new') || isFirstAuthor;

        const badgeColor = year === '2026' ? 'var(--nasa-blue)' : (year === '2024' ? '#FC3D21' : (year === '2023' ? '#718096' : '#A0AEC0'));

        const pubDiv = document.createElement('div');
        pubDiv.className = 'pub';
        pubDiv.setAttribute('data-year', year);
        pubDiv.setAttribute('data-first', isFirstAuthor ? 'true' : 'false');
        pubDiv.setAttribute('data-discovery', isDiscovery ? 'true' : 'false');

        let metaString = [doi, eprint].filter(Boolean).join(' | ');

        // Rigenera il blocco BibTeX pulito per il singolo articolo
        const singleBibtex = bibtexParse.toBibtex([entry]);

        pubDiv.innerHTML = `
          <div class="authors">
            <span class="badge" style="background:${badgeColor}">${year}</span> ${authors}
            ${isFirstAuthor ? '[<span>PRIMO AUTORE / FIRST AUTHOR</span>]' : ''}
            ${isFirstAuthor ? '<span class="note">⭐ <span>SCOPERTA / DISCOVERY</span></span>' : ''}
          </div>
          <div class="title"><a target="_blank" href="${adsurl || '#'}">${title}</a></div>
          <div class="journal">${journal}</div>
          <div class="doi">${metaString}</div>
          <div class="pub-actions">
            <button class="copy-btn" onclick="copyCitation(this, '${authors.replace(/'/g, "")}, ${year}, ${journal}')">📋 Citazione</button>
            <button class="copy-btn" onclick="copySpecificBibtex(this, \`${escapeHtml(singleBibtex)}\`)">📦 BibTeX</button>
          </div>
        `;
        container.appendChild(pubDiv);
      });

      updateCounters(totalCount, firstCount);
    }

    function updateCounters(total, first) {
      document.getElementById('counters').innerHTML = `Total Publications: <strong>${total}</strong> | First Author: <strong>${first}</strong>`;
    }

    function copyCitation(btn, text) {
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerText;
        btn.innerText = '✅ Copiato!';
        setTimeout(() => btn.innerText = originalText, 2000);
      });
    }

    function copySpecificBibtex(btn, bibtexText) {
      navigator.clipboard.writeText(bibtexText).then(() => {
        const originalText = btn.innerText;
        btn.innerText = '✅ Copiato!';
        setTimeout(() => btn.innerText = originalText, 2000);
      });
    }

    // Avvia il caricamento all'avvio della pagina
    window.addEventListener('DOMContentLoaded', loadBibtexFile);
  </script>
</body>
</html>
